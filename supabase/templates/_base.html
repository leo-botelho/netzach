<!--
  ═══════════════════════════════════════════════════════════════
  MOLDE DOS EMAILS DO NETZACH — não colar este arquivo no Supabase

  Este é o esqueleto que os outros templates desta pasta seguem.
  Serve de referência quando for criar um email novo.

  Por que o HTML é assim, com tabelas e estilo em cada tag:
  clientes de email não são navegadores. O Gmail remove <style> do
  cabeçalho, o Outlook usa o motor do Word, e flexbox e grid não
  existem em boa parte deles. Tabela aninhada com estilo embutido é
  feio de ler e é o que funciona em todos.

  Cormorant Garamond não carrega no Gmail: por isso todo título tem
  Georgia como reserva, que existe em qualquer lugar e tem o mesmo
  ar cerimonial.

  Paleta do documento (§13):
    Noite sagrada    #2E1F5E   fundo
    Violeta          #8B5CF6   ação
    Dourado lunar    #C9A84C   títulos e destaque
    Creme            #F5F0E8   texto sobre fundo escuro
    Rosa cíclico     #D4A5C9   acento suave
  ═══════════════════════════════════════════════════════════════
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#1B1238;margin:0;padding:32px 12px;">
  <tr>
    <td align="center">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:520px;background-color:#2E1F5E;border:1px solid #4E3A8E;border-radius:16px;">

        <!-- Marca -->
        <tr>
          <td align="center" style="padding:40px 32px 8px;">
            <div style="font-size:32px;line-height:1;margin-bottom:12px;">✦</div>
            <div style="font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
                        font-size:26px;letter-spacing:3px;color:#C9A84C;">NETZACH</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:2px;
                        text-transform:uppercase;color:#B3A1CC;margin-top:6px;">
              Portal de bem-estar feminino
            </div>
          </td>
        </tr>

        <!-- Conteúdo -->
        <tr>
          <td style="padding:24px 32px 8px;">
            <!-- TÍTULO E TEXTO ENTRAM AQUI -->
          </td>
        </tr>

        <!-- Botão: tabela, porque <a> com padding quebra no Outlook -->
        <tr>
          <td align="center" style="padding:8px 32px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#C9A84C;border-radius:12px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block;padding:14px 32px;
                            font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;
                            font-weight:bold;color:#2E1F5E;text-decoration:none;">
                    Texto do botão
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Rodapé -->
        <tr>
          <td style="padding:0 32px 32px;border-top:1px solid #4E3A8E;">
            <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;
                      color:#A294C2;margin:20px 0 0;">
              Se não foi você quem pediu, pode ignorar esta mensagem com tranquilidade.
            </p>
          </td>
        </tr>

      </table>

      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;
                  color:#A294C2;margin-top:20px;font-style:italic;">
        Tenha a sua própria sacerdotisa
      </div>

    </td>
  </tr>
</table>
