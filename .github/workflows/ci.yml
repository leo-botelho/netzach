name: CI

# Antes não havia verificação automática nenhuma, e o build de produção
# pulava o type-check de propósito.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Sem `version`: usa o campo packageManager do package.json, que
      # é a mesma versão que gera o lockfile localmente.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Build
        # As variáveis do Supabase são exigidas no import do client.
        # Valores de fachada bastam: nada aqui se conecta ao banco.
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-ci
        run: pnpm build
